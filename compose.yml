# ─────────────────────────────────────────────────────────────────────────────
# ProwJack — Docker Compose (exemplo genérico)
#
# Para usar:
#   1. Copie `.env.example` para `.env` e preencha.
#   2. `docker compose up -d --build`
#   3. Abra http://localhost:7014/configure
#
# Este arquivo NÃO contém segredos — eles ficam no `.env` (ignorado pelo git).
# Ajuste portas, volumes e serviços conforme o seu ambiente.
# ─────────────────────────────────────────────────────────────────────────────

services:
  prowjack:
    image: ghcr.io/viniciusss100/prowjack:latest   # ou use build: . (abaixo)
    # build:
    #   context: .
    container_name: prowjack
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # A porta INTERNA usada pelo addon (Dockerfile já define 7860).
      PORT: 7860
      # Pasta de persistência das configs cfg_... (volume abaixo).
      CONFIG_DATA_DIR: /data
    ports:
      # host:container — mude a porta do host conforme quiser (ex.: "7014:7860")
      - "7014:7860"
    volumes:
      - prowjack_data:/data
      # opcional: mapear download/produção do qBittorrent
      # - /caminho/para/downloads:/downloads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7860/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Redis (cache) — opcional, mas recomendado ─────────────────────────────
  # Se não quiser/usar Redis, deixe REDIS_URL vazio e PROJACK_REDIS_DISABLED=1
  # no .env (cache em memória, recomeça a cada reinício do addon).
  redis:
    image: redis:7-alpine
    container_name: prowjack-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    # Porta do host comentada: o addon acessa via rede interna (redis:6379).
    # ports:
    #   - "6379:6379"

volumes:
  prowjack_data:
  redis_data: